name: check disk
run-name: check disk
on:
  push:
  pull_request:
env:
  ZSDK_VERSION: 0.17.0-rc2
  FVP_BASE_REVC_VERSION: 11.24_11

jobs:
  After_check:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      matrix:
        attempt: [1,2,3,4,5]
      fail-fast: false

    container:
      image: ghcr.io/zephyrproject-rtos/ci-base:latest
      options: '--entrypoint /bin/bash'

    steps:
      - name: check disk
        run: |
          df -h
          echo "show root"
          ls -al /
          echo "GITHUB_WORKSPACE==${GITHUB_WORKSPACE}"
          ls -al $GITHUB_WORKSPACE
          cd $GITHUB_WORKSPACE
          cd ../..
          pwd
          du -h --max-depth=1 -- */ | sort -hr

          cd  /__t
          pwd
          du -h --max-depth=1 -- */ | sort -hr

  